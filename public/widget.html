<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#fff;--soft:#f3f3f0;--text:#11110f;--muted:#71716b;--line:#e5e5e0;--ink:#171716;--wait:#7a581a;--waitbg:#f6eddc}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--surface:#20201f;--soft:#2b2b28;--text:#f3f3ef;--muted:#aaa9a2;--line:#363632;--ink:#f3f3ef;--wait:#e5bc71;--waitbg:#3c321f}}
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{width:100%;padding:2px 0 4px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.55px}.sub{font-size:11px;line-height:1.35;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{font-size:10px;color:var(--muted);background:var(--soft);border-radius:999px;padding:6px 9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.action{min-height:56px;border:0;border-radius:16px;padding:10px 12px;text-align:left;font-weight:760;font-size:13px;line-height:1.18}
.action small{display:block;font-size:10px;font-weight:550;line-height:1.3;margin-top:5px;opacity:.7}.record{background:var(--ink);color:var(--bg)}.upload{background:var(--soft);color:var(--text)}
.section{display:flex;align-items:end;justify-content:space-between;margin:14px 2px 7px}.section b{font-size:13px}.section span{font-size:10px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0}.task:last-child{border-bottom:0}
.check{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;background:transparent;position:relative}.check:before{content:"";position:absolute;inset:10px;border:1.5px solid #a9a9a3;border-radius:50%}.check.done:before{background:var(--ink);border-color:var(--ink)}.check.done:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--bg)}
.taskmain{min-width:0;flex:1;padding:5px 0}.taskname{font-size:13px;line-height:1.35;font-weight:670;overflow-wrap:anywhere}.taskname.done{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}.chip,.status{min-height:27px;border:0;border-radius:999px;padding:0 8px;display:inline-flex;align-items:center;font-size:9px;background:var(--soft);color:var(--muted)}
.status{min-height:36px;font-weight:700}.status.wait{background:var(--waitbg);color:var(--wait)}
.meeting{padding:12px}.mtitle{font-size:13px;font-weight:730}.mmeta{font-size:10px;color:var(--muted);margin-top:4px}.empty{padding:16px 12px;color:var(--muted);font-size:12px;line-height:1.4;text-align:center}
.footer{font-size:10px;color:var(--muted);text-align:center;margin-top:10px}
@media(max-width:340px){.actions{grid-template-columns:1fr}.action{min-height:52px}}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div><div class="brand">Meeting OSS 2.1</div><div class="sub">Riunioni → decisioni → azioni</div></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="section" style="margin-top:6px"><b>Nuova riunione</b><span>inizia da qui</span></div><div class="actions">
    <button class="action record" id="record"><span>● Registra nuova riunione</span><small>Usa la registrazione audio di ChatGPT</small></button>
    <button class="action upload" id="upload"><span>↑ Carica audio riunione</span><small>Allega M4A, MP3, WAV o altro audio</small></button>
  </div>
  <div class="section"><b>Da fare adesso</b><span id="openCount"></span></div>
  <div class="card" id="tasks"></div>
  <div class="section"><b>Ultima riunione</b><span>recente</span></div>
  <div class="card" id="meeting"></div>
  <div class="footer">Solo le tue riunioni · dati separati per account</div>
</main>
<script type="module">
let data={meetings:[],tasks:[],stats:{todo:0,waiting:0,meetings:0}};
let rpcId=0;const pending=new Map();
const esc=(s="")=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const nextStatus=s=>s==="Da fare"?"In attesa":s==="In attesa"?"Fatto":"Da fare";
function notifyHeight(){requestAnimationFrame(()=>window.openai?.notifyIntrinsicHeight?.(Math.ceil(document.documentElement.scrollHeight)))}
function update(result){const d=result?.structuredContent||result?.toolOutput||result;if(d?.meetings&&d?.tasks){data=d;render()}}
function render(){
  document.getElementById("stats").innerHTML='<span class="stat">'+(data.stats?.todo||0)+' da fare</span><span class="stat">'+(data.stats?.waiting||0)+' attesa</span>';
  const open=(data.tasks||[]).filter(t=>t.status!=="Fatto").slice(0,4);
  document.getElementById("openCount").textContent=open.length?open.length+" visibili":"";
  document.getElementById("tasks").innerHTML=open.length?open.map(t=>{
    const done=t.status==="Fatto",wait=t.status==="In attesa";
    return '<div class="task"><button class="check '+(done?'done':'')+'" data-check="'+esc(t.id)+'" aria-label="Segna attività"></button><div class="taskmain"><div class="taskname '+(done?'done':'')+'">'+esc(t.title)+'</div><div class="meta">'+(t.meetingTitle?'<span class="chip">'+esc(t.meetingTitle)+'</span>':'')+(t.dueDate?'<span class="chip">'+esc(t.dueDate)+'</span>':'')+'<button class="status '+(wait?'wait':'')+'" data-status="'+esc(t.id)+'">'+esc(t.status)+'</button></div></div></div>';
  }).join(""):'<div class="empty">Nessuna attività aperta.</div>';
  const m=(data.meetings||[])[0];
  document.getElementById("meeting").innerHTML=m?'<div class="meeting"><div class="mtitle">'+esc(m.title)+'</div><div class="mmeta">'+esc(m.date||"")+' · '+Number(m.taskCount||0)+' attività</div></div>':'<div class="empty">Nessuna riunione salvata.</div>';
  document.querySelectorAll("[data-check]").forEach(b=>b.onclick=async()=>{const t=data.tasks.find(x=>x.id===b.dataset.check);if(!t)return;b.disabled=true;try{update(await window.openai.callTool("update_task_status",{task_id:t.id,status:"Fatto"}))}finally{b.disabled=false}});
  document.querySelectorAll("[data-status]").forEach(b=>b.onclick=async()=>{const t=data.tasks.find(x=>x.id===b.dataset.status);if(!t)return;b.disabled=true;try{update(await window.openai.callTool("update_task_status",{task_id:t.id,status:nextStatus(t.status)}))}finally{b.disabled=false}});
  notifyHeight();
}
document.getElementById("record").onclick=()=>window.openai?.sendFollowUpMessage?.({prompt:"Voglio registrare una nuova riunione in Meeting OSS 2.1. Guidami a registrare/allegare l'audio qui in ChatGPT; quando l'audio è disponibile, analizzalo e salva in Meeting OS una sintesi di massimo 5 punti, le decisioni reali e massimo 7 attività concrete senza inventare responsabili o scadenze.",scrollToBottom:true});
document.getElementById("upload").onclick=()=>window.openai?.sendFollowUpMessage?.({prompt:"Voglio caricare l'audio di una riunione in Meeting OSS 2.1. Chiedimi di allegare qui in ChatGPT il file audio; appena è disponibile, analizzalo e salva in Meeting OS una sintesi di massimo 5 punti, le decisioni reali e massimo 7 attività concrete senza inventare responsabili o scadenze.",scrollToBottom:true});
window.addEventListener("openai:set_globals",e=>{const g=e.detail?.globals;if(g?.toolOutput)update(g.toolOutput)},{passive:true});
update(window.openai?.toolOutput||data);render();
</script>
</body></html>
