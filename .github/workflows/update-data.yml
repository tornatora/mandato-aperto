name: Aggiorna dati Camera

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camera-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Allinea il repository alla main più recente
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Scarica e calcola i dati ufficiali
        run: npm run sync
      - name: Verifica il dataset
        run: npm run validate
      - name: Registra solo i cambiamenti reali
        run: |
          if git diff --quiet -- dist/data/deputies.json; then
            echo "Nessun aggiornamento"
            exit 0
          fi

          git config user.name "mandato-aperto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/deputies.json
          git commit -m "data: aggiornamento automatico Camera"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
