name: Aggiorna dati Camera

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/sync-camera.mjs"
      - "scripts/validate-data.mjs"
      - "scripts/compare-public-data.mjs"

permissions:
  contents: write

concurrency:
  group: camera-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Allinea il repository alla main più recente
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Conserva il dataset precedente
        run: cp dist/data/deputies.json /tmp/deputies-before.json
      - name: Scarica e calcola i dati ufficiali
        run: npm run sync
      - name: Verifica il dataset
        run: npm run validate
      - name: Verifica se i dati pubblici sono cambiati davvero
        id: semantic
        shell: bash
        run: |
          set +e
          node scripts/compare-public-data.mjs /tmp/deputies-before.json dist/data/deputies.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cp /tmp/deputies-before.json dist/data/deputies.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna variazione sostanziale nei dati pubblici"
          elif [ "$status" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rilevata una variazione reale nei dati pubblici"
          else
            exit "$status"
          fi
      - name: Registra solo i cambiamenti reali
        if: steps.semantic.outputs.changed == 'true'
        run: |
          git config user.name "mandato-aperto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/deputies.json
          git commit -m "data: aggiornamento automatico Camera"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
